---
- name: Get current containerd version
  ansible.builtin.command: containerd --version
  register: _k8s_installation__containerd_current_version
  changed_when: false
  failed_when: false

- name: Check containerd is installed or not
  ansible.builtin.set_fact:
    _k8s_installation__containerd_exists: >-
      {{
        _k8s_installation__containerd_current_version.rc == 0
      }}

- name: Determine current containerd version
  ansible.builtin.set_fact:
    _k8s_installation__containerd_current_version: >-
      {{
        _k8s_installation__containerd_current_version.stdout
        | regex_search('v([0-9]+\.[0-9]+\.[0-9]+)', '\1')
        | first
        | default('')
      }}
  when: _k8s_installation__containerd_exists

- name: Check whether need to upgrade containerd
  ansible.builtin.set_fact:
    _k8s_installation__containerd_tobe_upgraded: >-
      {{
        _k8s_installation__containerd_exists and
        (_k8s_installation__containerd_current_version is version(k8s_installation__containerd_version, '<'))
      }}

- name: Get current kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: _k8s_installation__kubeadm_current_version_stdout
  changed_when: false
  failed_when: false

- name: Check kubeadm is installed or not
  ansible.builtin.set_fact:
    _k8s_installation__kubeadm_exists: >-
      {{
        _k8s_installation__kubeadm_current_version_stdout.rc == 0
      }}

- name: Determine current kubeadm version
  ansible.builtin.set_fact:
    _k8s_installation__kubeadm_current_version: >-
      {{
        _k8s_installation__kubeadm_current_version_stdout.stdout
        | default('')
        | regex_replace('^v', '')
      }}
  when: _k8s_installation__kubeadm_exists

- name: Check whether need to upgrade kubeadm
  ansible.builtin.set_fact:
    _k8s_installation__kubeadm_tobe_upgraded: >-
      {{
        _k8s_installation__kubeadm_exists and
        (_k8s_installation__kubeadm_current_version is version(k8s_version, '<'))
      }}
