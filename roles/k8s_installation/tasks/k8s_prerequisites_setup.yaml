---
- name: Remove swap entries from /etc/fstab
  ansible.posix.mount:
    path: "{{ __k8s_installation__swap_item }}"
    fstype: swap
    state: absent
  become: true
  loop:
    - swap
    - none
  loop_control:
    loop_var: __k8s_installation__swap_item

- name: Disable swap
  ansible.builtin.command: swapoff -a
  become: true
  changed_when: true

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ __k8s_installation__kernel_module }}"
    state: present
  become: true
  loop:
    - overlay
    - br_netfilter
  loop_control:
    loop_var: __k8s_installation__kernel_module
  notify: Restart containerd

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  become: true

- name: Set required sysctl params for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ __k8s_installation__sysctl_item.name }}"
    value: "{{ __k8s_installation__sysctl_item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true
  become: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
  loop_control:
    loop_var: __k8s_installation__sysctl_item
  notify: Restart containerd

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true
  notify: Restart kubelet

- name: Ensure hostname resolves in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ private_ip }} {{ inventory_hostname }}"
    state: present
  become: true

- name: Disable firewalld if present
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  become: true
  failed_when: false
  when: ansible_facts.services['firewalld.service'] is defined
