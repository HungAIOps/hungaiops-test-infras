---
- name: Render Calico k8s manifest file
  ansible.builtin.template:
    src: calico.yaml.j2
    dest: /tmp/calico.yaml
    mode: "0644"

- name: Install or upgrade Calico via kubectl
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  become: true
  changed_when: true

- name: Wait for Calico pods to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --namespace=kube-system
      - --for=condition=Ready
      - --selector=k8s-app in (calico-node,calico-kube-controllers)
      - --timeout=1m
      - pod
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  become: true
  register: _calico__wait_result
  until: _calico__wait_result.rc == 0
  changed_when: false
