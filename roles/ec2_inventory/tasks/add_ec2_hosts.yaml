---
- name: Add master instance to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ env_name }}-master-node"
    groups: master_nodes
    ansible_connection: amazon.aws.aws_ssm
    ansible_aws_ssm_region: "{{ aws_region }}"
    ansible_aws_ssm_bucket_name: "{{ ec2_inventory__ssm_s3_bucket }}"
    ansible_aws_ssm_instance_id: "{{ ec2__master_instance_id }}"
    public_ip: "{{ ec2__master_instance_info.instances[0].public_ip_address }}"
    private_ip: "{{ ec2__master_instance_info.instances[0].private_ip_address }}"

- name: Add worker instances to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ env_name }}-worker-node-{{ __ec2_inventory__worker_add_index }}"
    groups: worker_nodes
    ansible_connection: amazon.aws.aws_ssm
    ansible_aws_ssm_region: "{{ aws_region }}"
    ansible_aws_ssm_bucket_name: "{{ ec2_inventory__ssm_s3_bucket }}"
    ansible_aws_ssm_instance_id: "{{ ec2__worker_instance_ids[__ec2_inventory__worker_add_index] }}"
    public_ip: >-
      {{
        (
          ec2__worker_instances_info.instances |
          selectattr('instance_id', 'equalto', ec2__worker_instance_ids[__ec2_inventory__worker_add_index]) |
          first
        ).public_ip_address
      }}
    private_ip: >-
      {{
        (
          ec2__worker_instances_info.instances |
          selectattr('instance_id', 'equalto', ec2__worker_instance_ids[__ec2_inventory__worker_add_index]) |
          first
        ).private_ip_address
      }}
  loop: "{{ range(0, ec2__worker_instance_ids | length) | list }}"
  loop_control:
    loop_var: __ec2_inventory__worker_add_index
