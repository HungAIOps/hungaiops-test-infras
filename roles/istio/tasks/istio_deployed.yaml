---
- name: Add the Istio Helm chart repository
  kubernetes.core.helm_repository:
    repo_name: "istio"
    repo_url: "https://istio-release.storage.googleapis.com/charts"

- name: Install or upgrade Istio base components
  kubernetes.core.helm:
    release_name: "istio-base"
    chart_ref: "istio/base"
    chart_version: "{{ istio__chart_version }}"
    release_namespace: "{{ istio__namespace }}"
    create_namespace: true
    kubeconfig: "{{ local_kubeconfig_path }}"
    wait: true
    timeout: "5m"
    atomic: true

- name: Render Istio Helm values
  ansible.builtin.template:
    src: istio.values.yaml.j2
    dest: /tmp/istio.values.yaml
    mode: "0644"

- name: Install or upgrade the Istio control plane
  kubernetes.core.helm:
    release_name: "istiod"
    chart_ref: "istio/istiod"
    chart_version: "{{ istio__chart_version }}"
    release_namespace: "{{ istio__namespace }}"
    kubeconfig: "{{ local_kubeconfig_path }}"
    values_files:
      - /tmp/istio.values.yaml
    wait: true
    timeout: "5m"
    atomic: true

- name: Render Istio Gateway Helm values
  ansible.builtin.template:
    src: gateway.values.yaml.j2
    dest: /tmp/gateway.values.yaml
    mode: "0644"
  when: istio__gateway_enabled

- name: Install or upgrade the Istio gateway
  kubernetes.core.helm:
    release_name: "istio-gateway"
    chart_ref: "istio/gateway"
    chart_version: "{{ istio__chart_version }}"
    release_namespace: "{{ istio__namespace }}"
    kubeconfig: "{{ local_kubeconfig_path }}"
    values_files:
      - /tmp/gateway.values.yaml
    wait: true
    timeout: "5m"
    atomic: true
  when: istio__gateway_enabled
